version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - '4000:4000'
    volumes:
      - ./backend/data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: 4000
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped
